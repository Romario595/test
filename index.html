<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram MiniApp Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .container {
            flex: 1;
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }
        
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            min-height: 100vh;
            overflow-y: auto;
        }
        
        .button {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 15px;
            padding: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            z-index: 1000;
        }
        
        .error {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.9);
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            z-index: 1000;
        }
        
        .centered {
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container" id="menuContainer">
        <!-- Колонки будут созданы динамически -->
    </div>
    
    <div class="loading" id="loading">
        Загрузка меню...
    </div>
    
    <div class="error" id="error">
        <div>
            <h2>Ошибка 1</h2>
            <p>Ответ на запрос меню не получен</p>
            <button onclick="retryLoadMenu()" style="margin-top: 20px; padding: 10px 20px; background: white; border: none; border-radius: 5px; cursor: pointer;">
                Повторить
            </button>
        </div>
    </div>

    <script>
        // Конфигурация
        const CONFIG = {
            SCRIPT_URL: 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE', // Заменить на реальный URL
            TIMEOUT: 10000, // 10 секунд
            ALLOWED_USER_IDS: [167488008, 331575942]
        };

        class MenuApp {
            constructor() {
                this.menuData = null;
                this.currentLevels = { A: null, B: null, C: null };
                this.init();
            }

            init() {
                this.setupFullscreen();
                this.loadMenu();
            }

            setupFullscreen() {
                // Устанавливаем полную высоту экрана
                document.documentElement.style.height = '100%';
                document.body.style.height = '100%';
                
                // Предотвращаем масштабирование
                document.addEventListener('touchmove', function(e) {
                    if (e.scale !== 1) { e.preventDefault(); }
                }, { passive: false });
            }

            async loadMenu() {
                this.showLoading();
                
                try {
                    const response = await this.fetchWithTimeout(CONFIG.SCRIPT_URL + '?action=menu', {
                        method: 'GET',
                        timeout: CONFIG.TIMEOUT
                    });

                    if (response && response.status === 'success') {
                        this.hideLoading();
                        this.menuData = this.parseMenuData(response.data);
                        this.renderMenu();
                    } else {
                        throw new Error('Invalid response');
                    }
                } catch (error) {
                    this.showError();
                }
            }

            fetchWithTimeout(url, options = {}) {
                const { timeout = 10000 } = options;
                
                const controller = new AbortController();
                const { signal } = controller;
                
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                
                return fetch(url, {
                    ...options,
                    signal
                })
                .then(response => response.json())
                .then(data => {
                    clearTimeout(timeoutId);
                    return data;
                })
                .catch(error => {
                    clearTimeout(timeoutId);
                    throw error;
                });
            }

            parseMenuData(data) {
                // Преобразуем данные из таблицы в иерархическую структуру
                const menu = {
                    A: new Set(),
                    B: new Map(),
                    C: new Map(),
                    D: new Map()
                };

                data.forEach(row => {
                    if (row[0]) menu.A.add(row[0]);
                    if (row[0] && row[1]) {
                        if (!menu.B.has(row[0])) menu.B.set(row[0], new Set());
                        menu.B.get(row[0]).add(row[1]);
                    }
                    if (row[1] && row[2]) {
                        if (!menu.C.has(row[1])) menu.C.set(row[1], new Set());
                        menu.C.get(row[1]).add(row[2]);
                    }
                    if (row[2] && row[3]) {
                        if (!menu.D.has(row[2])) menu.D.set(row[2], new Set());
                        menu.D.get(row[2]).add(row[3]);
                    }
                });

                return menu;
            }

            renderMenu() {
                const container = document.getElementById('menuContainer');
                container.innerHTML = '';
                container.className = 'container';

                // Создаем три колонки
                for (let i = 0; i < 3; i++) {
                    const column = document.createElement('div');
                    column.className = 'column';
                    column.id = `column${i}`;
                    container.appendChild(column);
                }

                this.renderLevelA();
            }

            renderLevelA() {
                const column = document.getElementById('column0');
                const items = Array.from(this.menuData.A);
                
                this.renderItemsInColumn(column, items, 'A');
                
                // Центрируем если элементов мало
                if (items.length * 110 < window.innerHeight) {
                    column.classList.add('centered');
                }
            }

            renderLevelB(parentItem) {
                const column = document.getElementById('column1');
                const items = this.menuData.B.has(parentItem) ? 
                    Array.from(this.menuData.B.get(parentItem)) : [];
                
                this.renderItemsInColumn(column, items, 'B', parentItem);
                
                // Очищаем колонку C
                document.getElementById('column2').innerHTML = '';
            }

            renderLevelC(parentItem) {
                const column = document.getElementById('column2');
                const items = this.menuData.C.has(parentItem) ? 
                    Array.from(this.menuData.C.get(parentItem)) : [];
                
                this.renderItemsInColumn(column, items, 'C', parentItem);
            }

            renderItemsInColumn(column, items, level, parent = null) {
                column.innerHTML = '';
                
                items.forEach(item => {
                    const button = document.createElement('button');
                    button.className = 'button';
                    button.textContent = item;
                    button.onclick = () => this.handleItemClick(item, level, parent);
                    column.appendChild(button);
                });
            }

            handleItemClick(item, level, parent) {
                switch (level) {
                    case 'A':
                        this.currentLevels.A = item;
                        this.renderLevelB(item);
                        break;
                    case 'B':
                        this.currentLevels.B = item;
                        this.renderLevelC(item);
                        break;
                    case 'C':
                        this.currentLevels.C = item;
                        // Здесь можно добавить обработку выбора конечного продукта
                        this.showProductDetails(item);
                        break;
                }
            }

            showProductDetails(product) {
                alert(`Выбран продукт: ${product}\n\nЗдесь может быть дополнительная информация о продукте, аллергены, состав и т.д.`);
            }

            showLoading() {
                document.getElementById('loading').style.display = 'flex';
            }

            hideLoading() {
                document.getElementById('loading').style.display = 'none';
            }

            showError() {
                document.getElementById('error').style.display = 'flex';
                this.hideLoading();
            }

            hideError() {
                document.getElementById('error').style.display = 'none';
            }
        }

        // Глобальная функция для повторной попытки
        function retryLoadMenu() {
            document.getElementById('error').style.display = 'none';
            app.loadMenu();
        }

        // Инициализация приложения
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new MenuApp();
        });

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            if (app && app.menuData) {
                app.renderMenu();
            }
        });
    </script>
</body>
</html>
