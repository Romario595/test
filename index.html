<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Assistant</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <div class="panel left-panel">
            <div class="buttons-container" id="left-buttons">
                <!-- Левая панель будет обновляться динамически -->
            </div>
        </div>
        
        <div class="panel middle-panel">
            <div class="buttons-container" id="middle-buttons">
                <!-- Средняя панель будет обновляться динамически -->
            </div>
        </div>
        
        <div class="panel right-panel">
            <div class="buttons-container" id="right-buttons">
                <!-- Правая панель будет обновляться динамически -->
            </div>
        </div>
    </div>

    <!-- Нижняя панель с кнопками действий -->
    <div class="action-panel" id="action-panel">
        <button class="action-btn" id="start-over-btn">В начало</button>
        <button class="action-btn" id="add-custom-btn">Добавить</button>
        <button class="action-btn" id="save-btn">Сохранить</button>
    </div>

    <!-- Модальное окно для добавления кнопки -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h3>Добавить новый элемент</h3>
            <input type="text" id="new-item-input" placeholder="Введите название..." maxlength="20">
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancel-add">Отмена</button>
                <button class="modal-btn confirm" id="confirm-add">Добавить</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
